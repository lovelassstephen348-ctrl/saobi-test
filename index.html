  "你的软肋是不太会处理拒绝和失控,偶尔会因为太急而忽略对方感受。但只要有人能在你面前稳住阵脚、不被你吓跑,你会意外地护短、护食、护到底。你不是坏,只是饿得比较快。"],
 tips:[
  "你需要的是一个能接住你强势的人。事先说清楚边界和安全词,你才能放心放肆。",
  "玩法推荐角色扮演、命令式调教、限时挑战(比如『十分钟内让我满意』)、掌控节奏的各种小游戏。",
  "试着放慢前戏一点点,延迟满足会让你的主导感更爽,对方也会更配合。",
  "对方说『不』的时候,请当场停下,不要再追问。这是你的帅气底线,也是你能长久拥有的原因。"],
 pair:{
  a:"盒子型遇上27型:你像一辆猛冲的跑车撞上一座老山,一个急一个慢,你越急他越稳。他的老练会让你第一次感觉到被反控,也许你嘴上骂着『老登』,身体却软得一塌糊涂。磨合成功后,你们是最耐操的一对。",
  b:"盒子型遇上栗子型:一个要使用,一个想被使用,天造地设,自带滤镜。你指哪儿他/她舔哪儿,你说什么他/她都说『好』。要小心的是别把对方当玩具,事后记得抱抱,不然小狗会在夜里偷偷哭湿枕头。"}
}
};

var $=function(id){return document.getElementById(id)};
var cover=$("cover"),quiz=$("quiz"),result=$("result");
var idx=0,answers=[],order=[];

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function show(el){[cover,quiz,result].forEach(function(e){e.classList.add("hidden")});el.classList.remove("hidden");window.scrollTo(0,0)}

function start(){
  idx=0;answers=[];
  order=Q.map(function(q){return shuffle([0,1,2,3])});
  show(quiz);render();
}

function render(){
  var q=Q[idx];
  $("qText").textContent=(idx+1)+". "+q.q;
  $("pText").textContent="第 "+(idx+1)+" / "+Q.length+" 题";
  var pct=Math.round(idx/Q.length*100);
  $("pPct").textContent=pct+"%";
  $("pBar").style.width=pct+"%";
  $("backBtn").style.visibility=idx===0?"hidden":"visible";
  var box=$("opts");box.innerHTML="";
  var letters=["A","B","C","D"];
  order[idx].forEach(function(oi,pos){
    var b=document.createElement("button");
    b.className="opt"+(answers[idx]===oi?" sel":"");
    var l=document.createElement("b");l.textContent=letters[pos];
    var s=document.createElement("span");s.textContent=q.o[oi][1];
    b.appendChild(l);b.appendChild(s);
    b.addEventListener("click",function(){choose(oi,b)});
    box.appendChild(b);
  });
}

var locked=false;
function choose(oi,btn){
  if(locked)return;locked=true;
  answers[idx]=oi;btn.classList.add("sel");
  setTimeout(function(){
    locked=false;
    if(idx<Q.length-1){idx++;render()}else{finish()}
  },220);
}

function finish(){
  $("pBar").style.width="100%";
  var sc={a:0,b:0,c:0};
  answers.forEach(function(oi,i){
    var k=Q[i].o[oi][0];
    if(k.length===1){sc[k]+=2}else{sc[k[0]]+=1;sc[k[1]]+=1}
  });
  var max=Math.max(sc.a,sc.b,sc.c);
  var top=["a","b","c"].filter(function(k){return sc[k]===max});
  var tie=top.length>1;
  var win=top[Math.floor(Math.random()*top.length)];
  showResult(win,sc,tie);
}

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function showResult(k,sc,tie){
  var r=R[k];result.innerHTML="";
  result.appendChild(el("div","badge","你的测试结果"));
  if(tie)result.appendChild(el("div","tie","你们难分伯仲,今晚可以一起"));
  result.appendChild(el("div","r-name",r.name));
  result.appendChild(el("div","r-persona","对应性格:"+r.persona));
  result.appendChild(el("div","r-tag",r.tag));
  var kw=el("div","kw");r.kw.forEach(function(w){kw.appendChild(el("span","","#"+w))});
  result.appendChild(kw);

  var s1=el("div","sec");s1.appendChild(el("h3","","▍性格详解"));
  r.desc.forEach(function(p){s1.appendChild(el("p","",p))});
  result.appendChild(s1);

  var s2=el("div","sec");s2.appendChild(el("h3","","▍相处 / 玩法建议"));
  r.tips.forEach(function(p,i){s2.appendChild(el("p","",(i+1)+". "+p))});
  result.appendChild(s2);

  var s3=el("div","sec");s3.appendChild(el("h3","","▍配对化学反应"));
  Object.keys(r.pair).forEach(function(o){
    var d=el("div","pair");
    d.appendChild(el("h4","",r.name+" × "+T[o]));
    d.appendChild(el("p","",r.pair[o]));
    s3.appendChild(d);
  });
  result.appendChild(s3);

  var s4=el("div","sec");s4.appendChild(el("h3","","▍你的骚度分布"));
  var total=sc.a+sc.b+sc.c||1;
  var box=el("div","scores");
  ["a","b","c"].forEach(function(x){
    var row=el("div","sc");row.appendChild(el("em","",T[x]));
    var bar=el("div","bar");var i=document.createElement("i");
    i.style.width=Math.round(sc[x]/total*100)+"%";bar.appendChild(i);row.appendChild(bar);
    row.appendChild(el("span","",sc[x]+"分"));box.appendChild(row);
  });
  s4.appendChild(box);result.appendChild(s4);

  var again=el("button","btn","再测一次");again.style.marginTop="26px";
  again.addEventListener("click",function(){show(cover)});
  result.appendChild(again);
  result.appendChild(el("div","tip","仅供娱乐,请在双方自愿、安全的前提下玩耍。"));
  show(result);
}

$("startBtn").addEventListener("click",start);
$("backBtn").addEventListener("click",function(){if(idx>0&&!locked){idx--;render()}});
})();
</script>
</body>
</html>
